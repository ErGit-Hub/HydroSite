<section class="hero" #heroSection (mousemove)="onHeroMouseMove($event, heroSection)" (mouseleave)="onHeroMouseLeave()">

  <div class="container hero-grid">
    <div class="hero-text">
      <h1>{{ 'HERO.TITLE' | translate }}</h1>

      <p>{{ 'HERO.SUBTITLE' | translate }}</p>

      <p class="hero-sub">{{ 'HERO.LEAD' | translate }}</p>

      <button class="btn btn-primary" [routerLink]="'/about'">
        {{ 'HERO.BUTTON' | translate }}
      </button>
    </div>
