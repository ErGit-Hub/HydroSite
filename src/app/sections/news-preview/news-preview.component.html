<section class="news-preview">
  <div class="container">
    <h2>{{ 'NEWS.TITLE' | translate }}</h2>

    <div class="news-list">
      @for (n of news; track n) {
        <div class="news-row" [routerLink]="['/news', n.id]">
          <div class="thumb" [class.placeholder]="isPlaceholder(n.image)">
            <img [src]="n.image" alt="" />
          </div>
          <div class="info">
            <div class="date">{{ n.date }}</div>
            <h3>{{ pickLang(n.title, currentLang) }}</h3>
          </div>
        </div>
      }
    </div>

    <a class="see-all" routerLink="/news">{{ 'NEWS.SEE_ALL' | translate }} →</a>
  </div>
</section>
