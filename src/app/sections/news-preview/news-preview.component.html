<section class="news-preview">
  <div class="container">
    <h2>{{ 'NEWS.TITLE' | translate }}</h2>

    <div class="news-grid">
      @for (n of news; track n) {
        <div class="news-card" [routerLink]="['/news', n.id]">
          <div class="image">
            <img [src]="n.image" alt="" />
          </div>
          <div class="content">
            <div class="date">
              <span class="icon">📅</span>
              <span>{{ n.date }}</span>
            </div>
            <h3>{{ pickLang(n.title, currentLang) }}</h3>
            <p class="preview">
              {{ pickLang(n.preview, currentLang) }}
            </p>
            <div class="read-more">
              {{ 'NEWS.READ_MORE' | translate }} →
            </div>
          </div>
        </div>
      }
    </div>

    <a class="see-all" routerLink="/news">{{ 'NEWS.SEE_ALL' | translate }} →</a>
  </div>
</section>
