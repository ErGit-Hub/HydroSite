<section class="news-preview">
  <div class="container">
    <h2>{{ 'NEWS.TITLE' | translate }}</h2>

    <div class="news-list">
      @if (loading) {
        @for (i of [1,2,3]; track i) {
          <div class="news-row skeleton">
            <div class="thumb"></div>
            <div class="info">
              <div class="date"></div>
              <h3></h3>
            </div>
          </div>
        }
      } @else {
        @for (n of visibleNews; track n) {
          <div class="news-row" [routerLink]="['/news', n.id]">
            <div class="thumb">
              <img [src]="thumbSrc(n)" alt="" (error)="onImageError(n)" />
            </div>
            <div class="info">
              <div class="date">{{ n.date }}</div>
              <h3>{{ pickLang(n.title, currentLang) }}</h3>
            </div>
          </div>
        }
      }
    </div>

    <a class="see-all" routerLink="/news">{{ 'NEWS.SEE_ALL' | translate }} →</a>
  </div>
</section>
