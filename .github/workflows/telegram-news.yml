name: Telegram news

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Только ru→en; поднимаем с ограниченным набором моделей, чтобы не грузить всё подряд.
      - name: Start LibreTranslate
        run: |
          docker run -d --name libretranslate -p 5000:5000 \
            libretranslate/libretranslate --load-only en,ru
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5000/languages > /dev/null; then
              echo "LibreTranslate готов"
              break
            fi
            sleep 5
          done

      - name: Fetch Telegram posts and publish to WordPress
        env:
          HYDROGEO_API_KEY: ${{ secrets.HYDROGEO_API_KEY }}
        run: node scripts/fetch-telegram-news.mjs

      - name: Stop LibreTranslate
        if: always()
        run: docker rm -f libretranslate || true

      - name: Commit updated state
        run: |
          git config user.name "hydrogeo-news-bot"
          git config user.email "actions@github.com"
          git add scripts/state.json
          if git diff --cached --quiet; then
            echo "Прогресс не изменился, коммитить нечего."
          else
            git commit -m "Автообновление новостей из Telegram-канала"
            git push
          fi
